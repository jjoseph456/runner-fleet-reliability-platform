[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "runner-fleet-reliability-platform"
version = "0.1.0"
description = "SLO, capacity, cost, and incident control plane for ephemeral GitHub Actions runner fleets."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Joseph P. Joseph" }]
dependencies = [
  "fastapi>=0.115,<1",
  "mcp>=2,<3",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
runner-fleet-api = "runner_fleet.__main__:main"
runner-fleet-simulate = "runner_fleet.cli:main"
runner-fleet-mcp = "runner_fleet.mcp_server:main"

[tool.setuptools.packages.find]
include = ["runner_fleet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
