name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: docker build -t runner-fleet-platform:test .

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra/bootstrap init -backend=false
      - run: tofu -chdir=infra/bootstrap validate
      - run: tofu -chdir=infra/aws init -backend=false
      - run: tofu -chdir=infra/aws validate
      - run: helm lint deploy/helm/runner-fleet-platform

  kind-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: kind create cluster --name runner-fleet-recovery --config deploy/kind/recovery.yaml
      - run: docker build -t runner-fleet-reliability-platform:local .
      - run: kind load docker-image runner-fleet-reliability-platform:local --name runner-fleet-recovery
      - run: |
          helm upgrade --install runner-fleet deploy/helm/runner-fleet-platform \
            --set image.pullPolicy=Never \
            --set serviceMonitor.enabled=false \
            --set prometheusRule.enabled=false
      - run: kubectl rollout status deployment/runner-fleet-platform --timeout=180s
      - run: |
          kubectl port-forward service/runner-fleet-platform 18080:8080 >/tmp/port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill $port_forward_pid' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/port-forward.log
          exit 1
      - if: always()
        run: kind delete cluster --name runner-fleet-recovery
